name: Docs

on:
  push:
    branches: [main]
    paths: ["**.md", ".markdownlint-cli2.jsonc", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**.md", ".markdownlint-cli2.jsonc", ".github/workflows/docs.yml"]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Markdown style
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: "**/*.md"

  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Relative links and #anchors on every PR; external links too on the weekly run.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress --include-fragments
            ${{ github.event_name != 'schedule' && '--offline' || '' }}
            --exclude-path node_modules
            './**/*.md'
          fail: true
