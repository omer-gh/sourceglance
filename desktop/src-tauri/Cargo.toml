[package]
name = "sourceglance"
version = "0.18.0"
description = "Your GitHub and GitLab issues, pull requests and project boards, one glance away."
authors = ["Mohammad Omer"]
license = "Apache-2.0"
repository = "https://github.com/omer-gh/sourceglance"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sourceglance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync"] }
url = "2"
# Native TLS, so certificates are checked against the system's trust settings.
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }

tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
objc2-foundation = { version = "0.3", features = ["NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
